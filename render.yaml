services:
  - type: web
    name: fork-maintainer
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: FORK_MAINTAINER_CONFIG
        sync: false
      - key: FORK_MAINTAINER_POLL_INTERVAL
        value: 300
      - key: FORK_MAINTAINER_ADDR
        value: 0.0.0.0:10000
    disk:
      name: mirror-data
      mountPath: /data/mirrors
      sizeGB: 10
