# Declarative repo synthesizer — reusable engine workflow.
#
# Caller example (in your fork, e.g. `.github/workflows/sync.yml`):
#   jobs:
#     sync:
#       uses: jonathanmorley/fork-maintainer/.github/workflows/synthesize.yml@v1 # pin to a SHA for reproducibility
#       permissions: { contents: write }
#       with: { base: "upstream/app@main", patches: "myorg/app@main", output: "myorg/app@main" }
#       secrets: { token: "${{ secrets.SYNTH_TOKEN }}" }
#   on: { push: { branches: [main] }, schedule: [{ cron: "0 6 * * *" }], workflow_dispatch: }
#
# Inputs:
#   base       (required) upstream base in `owner/name@branch` form.
#   patches    (required) multiline string, one `owner/name@branch` — or bare
#              `branch` meaning the *caller's* repo (`github.repository`) —
#              per line, applied top-to-bottom. Blank lines and lines starting
#              with `#` are ignored.
#   output     (required) destination in `owner/name@branch` form.
#   strategy   (optional) `merge` (default), `overlay`, or `replay`;
#              passed straight through to `synthesize --strategy`.
#   engine-ref (optional) git ref of THIS repo to check out and build the
#              `synthesize` binary from. Default `"main"`. A reusable workflow
#              cannot default to its own SHA in YAML, so: pin the caller's
#              `uses:` to a SHA/tag for reproducibility, and use `engine-ref`
#              to select the engine version (e.g. `v1`).
#
# Permissions: the CALLER must grant `contents: write`
# (`permissions: { contents: write }` on the calling job), otherwise the push
# to `output` fails.
#
# Token notes (precedence: explicit secret > sts mint > github.token):
#   - The `token` secret, when set, is exported as `SYNTH_TOKEN`.
#   - `sts-scope` + `sts-identity` mint a short-lived token in-job via
#     octo-sts/action (trust policy at
#     `.github/chainguard/{sts-identity}.sts.yaml` in the scope repo);
#     callers using it must grant `id-token: write`. No stored credentials.
#   - Otherwise the CLI falls back to `GITHUB_TOKEN`, then anonymous access
#     (public repos only).
#   - App/OIDC-minted tokens trigger downstream workflows on push;
#     `github.token` does NOT (by GitHub design).
#   - Private repos: the effective token needs read access to the base and
#     every patch repo, and write access to the output repo.
#
# Idempotency: `synthesize` exits 0 logging "no change" when the output is
# already up to date, so this is safe on a schedule.

name: Synthesize

on:
  workflow_call:
    inputs:
      base:
        description: "Upstream base in owner/name@branch form"
        required: true
        type: string
      patches:
        description: "Multiline owner/name@branch list (bare branch = caller repo), applied top-to-bottom"
        required: true
        type: string
      output:
        description: "Destination in owner/name@branch form"
        required: true
        type: string
      strategy:
        description: "Synthesize strategy: merge, overlay, or replay"
        default: "merge"
        required: false
        type: string
      engine-ref:
        description: "Ref of jonathanmorley/fork-maintainer to build the engine binary from"
        default: "main"
        required: false
        type: string
      sts-scope:
        description: "Octo STS scope (org or org/repo). When set together with sts-identity, a short-lived token is minted in-job via octo-sts/action — no credential secrets required. Callers using it must grant id-token: write."
        required: false
        type: string
        default: ''
      sts-identity:
        description: "Octo STS trust policy name (.github/chainguard/{sts-identity}.sts.yaml in the scope repo)."
        required: false
        type: string
        default: ''
    secrets:
      token:
        description: "Token with read access to base/patches and write access to output. Takes precedence over sts minting; when neither is set the run falls back to github.token, then anonymous access (public repos only)."
        required: false

concurrency:
  group: synthesize-${{ inputs.output }}
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jonathanmorley/fork-maintainer
          ref: ${{ inputs.engine-ref }}
          path: engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      - name: Build synthesize
        working-directory: engine
        run: cargo build --release

      - name: Resolve patch flags
        env:
          PATCHES: ${{ inputs.patches }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          PATCH_ARGS=""
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$line" in
              ""|"#"*) continue ;;
            esac
            case "$line" in
              *"/"*) patch="$line" ;;
              *) patch="$CALLER_REPO@$line" ;;
            esac
            PATCH_ARGS="$PATCH_ARGS --patch $patch"
          done <<< "$PATCHES"
          echo "PATCH_ARGS=$PATCH_ARGS" >> "$GITHUB_ENV"

      - name: Mint token via Octo STS
        id: sts
        if: inputs.sts-scope != '' && inputs.sts-identity != ''
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05  # v1.1.1
        with:
          scope: ${{ inputs.sts-scope }}
          identity: ${{ inputs.sts-identity }}

      - name: Run synthesize
        env:
          # Precedence: caller-provided secret, then the sts-minted token,
          # then this run's own token (the CLI resolves SYNTH_TOKEN, then
          # GITHUB_TOKEN). Anonymous access covers public repos with neither.
          SYNTH_TOKEN: ${{ secrets.token != '' && secrets.token || steps.sts.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ./engine/target/release/synthesize
          --base "${{ inputs.base }}"
          $PATCH_ARGS
          --output "${{ inputs.output }}"
          --strategy "${{ inputs.strategy }}"
