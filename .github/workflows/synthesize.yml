# Declarative repo synthesizer — reusable engine workflow.
#
# Caller example (in your fork, e.g. `.github/workflows/sync.yml`):
#   jobs:
#     sync:
#       uses: jonathanmorley/fork-maintainer/.github/workflows/synthesize.yml@v1 # pin to a SHA for reproducibility
#       permissions: { contents: write }
#       with: { base: "upstream/app@main", patches: "myorg/app@main", output: "myorg/app@main" }
#       secrets: { token: "${{ secrets.SYNTH_TOKEN }}" }
#   on: { push: { branches: [main] }, schedule: [{ cron: "0 6 * * *" }], workflow_dispatch: }
#
# Inputs:
#   base       (required) upstream base in `owner/name@branch` form.
#   patches    (required) multiline string, one `owner/name@branch` — or bare
#              `branch` meaning the *caller's* repo (`github.repository`) —
#              per line, applied top-to-bottom. Blank lines and lines starting
#              with `#` are ignored.
#   output     (required) destination in `owner/name@branch` form.
#   strategy   (optional) `merge` (default) or `overlay`; passed straight through
#              to `synthesize --strategy`.
#   engine-ref (optional) git ref of THIS repo to check out and build the
#              `synthesize` binary from. Default `"main"`. A reusable workflow
#              cannot default to its own SHA in YAML, so: pin the caller's
#              `uses:` to a SHA/tag for reproducibility, and use `engine-ref`
#              to select the engine version (e.g. `v1`).
#
# Permissions: the CALLER must grant `contents: write`
# (`permissions: { contents: write }` on the calling job), otherwise the push
# to `output` fails.
#
# Token notes:
#   - The secret `token` is exported as `SYNTH_TOKEN`; the CLI itself resolves
#     `--token` flag > `SYNTH_TOKEN` env > `GITHUB_TOKEN` env, so no flag is passed.
#   - GITHUB_TOKEN limitation: pushes made with the default `github.token` do
#     NOT trigger downstream workflows (by GitHub design). To trigger CI/deploy
#     workflows on the synthesized output, pass a PAT or GitHub App token instead.
#   - Private upstreams: the token needs read access to the base, every patch
#     repo, and write access to the output repo.
#
# Idempotency: `synthesize` exits 0 logging "no change" when the output is
# already up to date, so this is safe on a schedule.

name: Synthesize

on:
  workflow_call:
    inputs:
      base:
        description: "Upstream base in owner/name@branch form"
        required: true
        type: string
      patches:
        description: "Multiline owner/name@branch list (bare branch = caller repo), applied top-to-bottom"
        required: true
        type: string
      output:
        description: "Destination in owner/name@branch form"
        required: true
        type: string
      strategy:
        description: "Synthesize strategy: merge or overlay"
        default: "merge"
        required: false
        type: string
      engine-ref:
        description: "Ref of jonathanmorley/fork-maintainer to build the engine binary from"
        default: "main"
        required: false
        type: string
    secrets:
      token:
        description: "Token with read access to base/patches and write access to output"
        required: true

concurrency:
  group: synthesize-${{ inputs.output }}
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jonathanmorley/fork-maintainer
          ref: ${{ inputs.engine-ref }}
          path: engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: engine

      - name: Build synthesize
        working-directory: engine
        run: cargo build --release

      - name: Resolve patch flags
        env:
          PATCHES: ${{ inputs.patches }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          PATCH_ARGS=""
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$line" in
              ""|"#"*) continue ;;
            esac
            case "$line" in
              *"/"*) patch="$line" ;;
              *) patch="$CALLER_REPO@$line" ;;
            esac
            PATCH_ARGS="$PATCH_ARGS --patch $patch"
          done <<< "$PATCHES"
          echo "PATCH_ARGS=$PATCH_ARGS" >> "$GITHUB_ENV"

      - name: Run synthesize
        env:
          # Prefer the caller-provided secret; fall back to this run's own
          # token (the CLI resolves SYNTH_TOKEN, then GITHUB_TOKEN).
          # Belt-and-suspenders: secret transport to reusable workflows has
          # been observed to arrive empty while github.token is populated.
          SYNTH_TOKEN: ${{ secrets.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ./engine/target/release/synthesize
          --base "${{ inputs.base }}"
          $PATCH_ARGS
          --output "${{ inputs.output }}"
          --strategy "${{ inputs.strategy }}"
